worker_processes auto;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;
        root         /usr/share/nginx/html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_comp_level 6;
        etag on;

        # Serve prebuilt HTML; fall back to the SPA shell for explorer routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache fingerprinted assets and data.
        location /assets/ { add_header Cache-Control "public, max-age=31536000"; }
        location /pagefind/ { add_header Cache-Control "public, max-age=86400"; }

        # Always revalidate the entry documents and the graph data.
        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /data/atlas.json { add_header Cache-Control "no-cache"; }

        error_page 404 /404.html;
    }
}
