worker_processes auto;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cache policy, set once at server level so the security headers below are
    # not dropped by a location-level add_header. Prebuilt HTML and the graph
    # data always revalidate; assets (versioned with ?v=) cache long.
    map $sent_http_content_type $cache_by_type {
        ~^text/html "no-cache";
        default     "";
    }
    map $uri $cache_control {
        ~^/assets/        "public, max-age=31536000";
        ~^/pagefind/      "public, max-age=86400";
        /data/atlas.json  "no-cache";
        default           $cache_by_type;
    }

    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;
        root         /usr/share/nginx/html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_comp_level 6;
        etag on;

        # Relative Location headers, so redirects keep the host's public port.
        absolute_redirect off;

        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Every explorer route (/, /nodes/<id>/[<tab>/]) is prebuilt by Hugo.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
