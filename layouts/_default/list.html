{{ define "main" }}
<main class="doc-wide">
    <div class="idx-head"><div><h1>{{ .Title }}</h1></div></div>
    <div class="cardgrid">
        {{ range .Pages.ByTitle }}
        <a class="ncard" href="{{ .RelPermalink }}" style="--accent: var(--theme-action)">
            <span class="ncard__type"><i></i>{{ .Params.node_type | default "Entry" }}</span>
            <div class="ncard__title">{{ .Title }}</div>
            {{ with .Params.summary }}<div class="ncard__sum">{{ . }}</div>{{ end }}
        </a>
        {{ end }}
    </div>
</main>
{{ end }}
