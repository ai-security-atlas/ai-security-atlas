<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    {{ if fileExists "static/assets/dist/styles.js" }}
        <link rel="stylesheet" href="/assets/dist/styles.css">
    {{ end }}
    <!-- Load pre-built Tailwind CSS if using standard Vite build -->
    <script type="module" crossorigin src="/assets/dist/app.js"></script>
    <link rel="stylesheet" href="/assets/dist/app.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="/" class="flex items-center gap-2">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <span class="font-bold text-xl tracking-tight">AI Security Atlas</span>
                    </a>
                </div>
                <div class="flex items-center gap-6">
                    <a href="/nodes" class="text-sm font-medium text-gray-500 hover:text-gray-900">Nodes</a>
                    <a href="/sources" class="text-sm font-medium text-gray-500 hover:text-gray-900">Sources</a>
                    <a href="/graph" class="text-sm font-medium bg-blue-50 text-blue-700 px-3 py-1.5 rounded-md hover:bg-blue-100">Explorer</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 min-h-[calc(100vh-4rem)]">
        {{ block "main" . }}{{ end }}
    </main>
</body>
</html>
