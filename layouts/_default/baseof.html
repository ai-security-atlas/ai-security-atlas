<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{ partial "head-seo.html" . }}
    <link rel="stylesheet" href="/assets/dist/styles.css?v={{ now.Unix }}">
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        var r = document.documentElement;
        r.classList.add(t); r.setAttribute('data-theme', t);
      })();
    </script>
</head>
<body class="docpage">
    <header class="sitehead">
        <a href="/" class="sitehead__brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
            AI Security <small>ATLAS</small>
        </a>
        <nav class="sitehead__nav">
            <a href="/nodes/" class="hideS">Topics</a>
            <a href="/sources/" class="hideS">Sources</a>
            <a href="/labs/" class="hideS">Labs</a>
            <a href="/" class="cta">Explorer</a>
            <button class="tt" onclick="(function(){var r=document.documentElement;var d=r.getAttribute('data-theme')==='dark';var t=d?'light':'dark';r.classList.remove('dark','light');r.classList.add(t);r.setAttribute('data-theme',t);localStorage.setItem('theme',t);})()" aria-label="Toggle theme" title="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
            <a class="tt" href="https://github.com/ai-security-atlas/ai-security-atlas" target="_blank" rel="noreferrer" aria-label="Source &amp; contributions on GitHub" title="Source &amp; contributions on GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.2 11.16.6.1.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.72-4.04-1.6-4.04-1.6-.55-1.36-1.33-1.72-1.33-1.72-1.09-.73.08-.72.08-.72 1.2.08 1.84 1.22 1.84 1.22 1.07 1.8 2.8 1.28 3.49.98.1-.76.42-1.28.76-1.57-2.67-.3-5.47-1.31-5.47-5.83 0-1.29.47-2.34 1.23-3.17-.12-.3-.53-1.52.12-3.16 0 0 1-.32 3.3 1.21a11.5 11.5 0 0 1 6 0c2.3-1.53 3.29-1.21 3.29-1.21.65 1.64.24 2.86.12 3.16.77.83 1.23 1.88 1.23 3.17 0 4.53-2.81 5.53-5.49 5.82.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .31.21.68.83.56A12.3 12.3 0 0 0 24 12.29C24 5.78 18.63.5 12 .5z"/></svg>
            </a>
        </nav>
    </header>
    {{ block "main" . }}{{ end }}
    <footer class="site-foot">
        <div class="site-foot__inner">
            <div class="site-foot__brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                AI Security Atlas — a learning platform for AI security, grounded in sources.
            </div>
            <nav class="site-foot__links">
                <a href="/">Explorer</a>
                <a href="/nodes/">Topics</a>
                <a href="/sources/">Sources</a>
                <a href="/labs/">Labs</a>
                <a href="/views/">Views</a>
                <a href="/about/">About</a>
                <a href="/privacy/">Privacy</a>
            </nav>
        </div>
    </footer>
</body>
</html>
