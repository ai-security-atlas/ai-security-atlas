baseURL = "https://ai-security-atlas.github.io/"
languageCode = "en-us"
title = "AI Security Atlas"
enableRobotsTXT = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # Lab guides (content/labs/<id>.md) link to their headings with GitHub's anchors (README covers[].anchor).
  [markup.goldmark.parser]
    autoHeadingIDType = "github"
  # Plain <pre><code class="language-x"> styled by .prose (no inline Chroma colors that ignore the theme).
  [markup.highlight]
    codeFences = false

[params]
  author = "Lenin Alevski"
  description = "An opinionated, evidence-linked knowledge graph of how AI systems are attacked, defended, and evaluated."
  ogImage = "og.png"
  # Set to a measurement ID (e.g. G-XXXXXXX) to enable cookieless analytics.
  # Left empty by design: the Atlas ships with no tracking (see PRD D10/7.6).
  googleAnalytics = ""
  twitter = ""

[sitemap]
  changefreq = "weekly"
  priority = 0.6
