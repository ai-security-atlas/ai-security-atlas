# AI Security Atlas labs: shared stack. Requires Docker Compose >= 2.20.0.
# Pick a backend block in .env (see .env.example) and set COMPOSE_PROFILES from the lab's Setup 1.
# Profiles: ollama (container Ollama + model puller), chat (Open WebUI),
#           workbench (Python workbench), supply (workbench + hardened sandbox),
#           rag-agent (atlas-app, the shared support-assistant fixture).
#           web (fixture-web: poisoned pages, a mailbox and a canary collector; compose network only).
name: atlas-labs

x-model-backend: &model-backend
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  # (a) container-ollama: CPU-only on every host in v1.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}
    profiles: ["ollama"]
    volumes:
      - ollama-models-v1:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NO_CLOUD: "1"
      LLAMA_ARG_THREADS: ${OLLAMA_CPU_THREADS:-8}   # mandatory: the default (all vCPUs) stalls under load
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot puller of $LAB_MODELS into container Ollama. Host-Ollama users pull on the host.
  models:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LAB_MODELS: ${LAB_MODELS:-qwen2.5vl:3b moondream:1.8b}
    entrypoint: ["/bin/sh", "-c", "for m in $$LAB_MODELS; do echo pulling $$m; ollama pull $$m || exit 1; done; ollama list"]
    restart: "no"

  # Profile "chat": Open WebUI, talks to Ollama (a/b) or an OpenAI-compatible API (c).
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.12.3-slim}
    profiles: ["chat"]
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    environment:
      <<: *model-backend
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA_API:-True}
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-False}
      WEBUI_AUTH: "False"                 # single-user local lab; cannot be flipped once users exist
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-atlas-labs-local-only-not-a-secret-0000}
      ENABLE_PERSISTENT_CONFIG: "False"   # .env stays the source of truth when switching backends
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ENABLE_WEB_SEARCH: "False"
      DEFAULT_MODELS: ${DEFAULT_MODEL:-qwen2.5vl:3b}
      TASK_MODEL: ${TASK_MODEL:-}
      ENABLE_TITLE_GENERATION: "False"    # avoid extra background calls on slow CPU backends
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      # Built-in tools (memory, time, ...) are attached to every browser chat, and Ollama rejects
      # them for models without tool support (qwen2.5vl:3b: "does not support tools").
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data-v1:/app/backend/data
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    restart: unless-stopped

  # Python workbench: network on, repo mounted read-write. Builds, downloads, white-box work.
  workbench:
    build:
      context: ./workbench
    image: atlas-labs/workbench:${WORKBENCH_TAG:-v3}
    profiles: ["workbench", "supply"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /labs
    volumes:
      - ./:/labs
      - hf-cache-v1:/cache/hf
    environment:
      <<: *model-backend
      LAB_BACKEND: ${LAB_BACKEND:-}
      LAB_LLM_BASE_URL: ${LAB_LLM_BASE_URL:-}
      LAB_LLM_API_KEY: ${LAB_LLM_API_KEY:-}
      LAB_VLM_MODEL: ${LAB_VLM_MODEL:-}
      LAB_TRANSFER_MODELS: ${LAB_TRANSFER_MODELS:-}
      LAB_CHAT_MODEL: ${LAB_CHAT_MODEL:-}
      LAB_JUDGE_MODEL: ${LAB_JUDGE_MODEL:-}
      PYTHONPATH: /labs/_shared
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: ["bash"]

  # Same image, isolated: no network, read-only root and checkout, outputs to tmpfs /work.
  sandbox:
    image: atlas-labs/workbench:${WORKBENCH_TAG:-v3}
    pull_policy: never
    profiles: ["supply"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp", "/work"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /labs
    volumes:
      - ./:/labs:ro
    environment:
      ATLAS_WORK: /work
      HOME: /tmp
      PYTHONPATH: /labs/_shared
    stdin_open: true
    tty: true
    command: ["bash"]

  # Profile "rag-agent": atlas-app, the shared "Atlas Widgets" support assistant (labs/_shared/atlas_app).
  # OpenAI-compatible on http://atlas-app:8000/v1 (compose network) and 127.0.0.1:${ATLAS_APP_PORT}.
  # Slim image (no torch); it calls the model backend from the .env block. Audit log in a named volume.
  atlas-app:
    build:
      context: ./_shared/atlas_app
    image: atlas-labs/atlas-app:${ATLAS_APP_TAG:-v2}
    profiles: ["rag-agent"]
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LAB_BACKEND: ${LAB_BACKEND:-}
      LAB_LLM_BASE_URL: ${LAB_LLM_BASE_URL:-}
      LAB_LLM_API_KEY: ${LAB_LLM_API_KEY:-}
      LAB_CHAT_MODEL: ${LAB_CHAT_MODEL:-qwen2.5:3b}
      ATLAS_APP_LABS: /labs               # where per-lab plug-ins (labs/<lab>/atlas_profiles.py) are found
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atlas-app-data-v1:/data
      - ./:/labs:ro
    ports:
      - "127.0.0.1:${ATLAS_APP_PORT:-8100}:8000"
    restart: unless-stopped

  # Profile "web": fixture-web, the shared poisoned-content fixture (labs/_shared/fixture_web): fictional web
  # pages, a mailbox, a mock outgoing-mail relay and a canary collector that logs any request carrying a lab
  # canary. Stdlib only, on the workbench image. Compose network only (http://fixture-web:8000): no host port,
  # read-only, no capabilities; it never makes a request itself. Its log is in memory (GET /_admin/log).
  fixture-web:
    image: atlas-labs/workbench:${WORKBENCH_TAG:-v3}
    pull_policy: never
    profiles: ["web"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /opt/fixture
    volumes:
      - ./_shared/fixture_web:/opt/fixture/fixture_web:ro
    environment:
      PYTHONPATH: /opt/fixture
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    command: ["python", "-m", "fixture_web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Profile "serving": llama.cpp server, the shared GGUF serving fixture (labs/_shared/serving).
  # serving-model fetches the pinned GGUF into hf-cache-v1 and checks its sha256; llama-server then
  # serves it on http://llama-server:8080 (compose network) and 127.0.0.1:${SERVING_PORT} (host).
  # Swap the model with SERVING_MODEL (a path inside the container, e.g. /labs/<lab>/work/x.gguf)
  # and add flags with SERVING_ARGS; `docker compose up -d --wait llama-server` applies them.
  serving-model:
    image: atlas-labs/workbench:${WORKBENCH_TAG:-v3}
    pull_policy: never
    profiles: ["serving"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /labs
    volumes:
      - ./:/labs:ro
      - hf-cache-v1:/cache/hf
    environment:
      PYTHONPATH: /labs/_shared
      HOME: /tmp
    command: ["python", "-m", "serving.fetch"]
    restart: "no"

  llama-server:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11977@sha256:01c2bc28d51291536df2ccebe5c6af1cdec9ea9b2bd98ac59556408caf96d3f8}
    profiles: ["serving"]
    depends_on:
      serving-model:
        condition: service_completed_successfully
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hf-cache-v1:/cache/hf:ro
      - ./:/labs:ro
    environment:
      LLAMA_ARG_THREADS: ${SERVING_CPU_THREADS:-4}
      LLAMA_SERVER_SLOTS_DEBUG: ${SERVING_SLOTS_DEBUG:-0}   # 1 = /slots also returns prompts and outputs (debug only)
    # The image's own env sets LLAMA_ARG_HOST=0.0.0.0 and LLAMA_ARG_PORT=8080; every other flag is the build default.
    command: >-
      --model ${SERVING_MODEL:-/cache/hf/hub/models--HuggingFaceTB--SmolLM2-360M-Instruct-GGUF/snapshots/593b5a2e04c8f3e4ee880263f93e0bd2901ad47f/smollm2-360m-instruct-q8_0.gguf}
      --alias ${SERVING_ALIAS:-smollm2-360m} ${SERVING_ARGS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    ports:
      - "127.0.0.1:${SERVING_PORT:-8180}:8080"
    restart: unless-stopped

  # The same server with the hardened reference flags (LAB-14 Defend). Reachable on the compose
  # network only (http://llama-server-hardened:8080), with the lab's non-secret key file; no host port.
  llama-server-hardened:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11977@sha256:01c2bc28d51291536df2ccebe5c6af1cdec9ea9b2bd98ac59556408caf96d3f8}
    profiles: ["serving"]
    depends_on:
      serving-model:
        condition: service_completed_successfully
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hf-cache-v1:/cache/hf:ro
      - ./_shared/serving/lab-api-keys.txt:/run/serving/api-keys.txt:ro
    environment:
      LLAMA_ARG_THREADS: ${SERVING_CPU_THREADS:-4}
    command: >-
      --model ${SERVING_MODEL:-/cache/hf/hub/models--HuggingFaceTB--SmolLM2-360M-Instruct-GGUF/snapshots/593b5a2e04c8f3e4ee880263f93e0bd2901ad47f/smollm2-360m-instruct-q8_0.gguf}
      --alias ${SERVING_ALIAS:-smollm2-360m}
      --api-key-file /run/serving/api-keys.txt --no-slots --no-webui --cors-origins localhost
      --ctx-size 2048 --parallel 4 --no-kv-unified
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

volumes:
  ollama-models-v1:
  open-webui-data-v1:
  hf-cache-v1:
  atlas-app-data-v1:
