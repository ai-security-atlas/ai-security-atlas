name: Deploy to GitHub Pages

# Builds the site and pushes the generated public/ into the separate
# ai-security-atlas/AI-SECURITY-ATLAS.github.io repository, which GitHub Pages
# serves at https://ai-security-atlas.github.io/.
#
# Requires a repository secret DEPLOY_TOKEN: a fine-grained PAT (or classic PAT
# with `repo`) that has write access to the target Pages repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: make install

      - name: Build (production)
        run: make build-prod

      # Publish the built output as the entire contents of the Pages repo.
      # A fresh init + force-push works whether the target is empty or already
      # populated; the source repo keeps the real project history.
      - name: Publish to Pages repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        working-directory: public
        run: |
          test -f .nojekyll || touch .nojekyll
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push -f "https://x-access-token:${DEPLOY_TOKEN}@github.com/ai-security-atlas/AI-SECURITY-ATLAS.github.io.git" main
