name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: make install

      - name: Build site
        run: make build

      - name: Verify build output
        run: |
          test -f public/index.html
          test -f public/nodes/attack-training-extraction/index.html
          test -d public/pagefind
          test -f public/labs/index.html
          for lab in attack-unsafe-load attack-visual-jailbreak; do
            test -f "public/labs/$lab/explainer/index.html"
            grep -q 'data-explainer=' "public/labs/$lab/index.html"
            grep -q 'id=lab-guide' "public/labs/$lab/index.html"
            grep -q labcard "public/nodes/$lab/index.html"
          done
          test -f public/labs/tags/index.html
          test -f public/labs/_explainer/explainer.js
          echo "Build output looks good."

  labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint lab READMEs and repo hygiene
        run: python3 labs/_tools/lint_readme.py

      - name: Payload review
        run: python3 labs/_shared/test_inert.py

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: labs/_explainer/test/package-lock.json

      - name: Explainer test (Chromium)
        working-directory: labs/_explainer/test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: make docker
